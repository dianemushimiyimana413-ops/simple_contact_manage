apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: simple-contact-manager-hpa
  namespace: production
  labels:
    app: simple-contact-manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: simple-contact-manager
  
  # Pod scaling limits
  minReplicas: 3
  maxReplicas: 10
  
  # Scaling metrics
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70    # Scale up when CPU > 70%
  
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80    # Scale up when memory > 80%
  
  # Scaling behavior (cooldown periods)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50                 # Scale down by 50% of current pods
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100                # Scale up by 100% (double pods)
        periodSeconds: 30
      - type: Pods
        value: 4                  # Or add 4 pods
        periodSeconds: 30
      selectPolicy: Max           # Select the policy that adds the most pods
