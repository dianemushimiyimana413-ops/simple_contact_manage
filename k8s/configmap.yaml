apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: production
  labels:
    app: simple-contact-manager
data:
  # Database configuration
  db.host: "mysql-service.production.svc.cluster.local"
  db.port: "3306"
  db.name: "contacts_db"
  db.user: "root"
  
  # Logging configuration
  log.level: "info"
  
  # Application configuration
  app.port: "3000"
  app.timeout: "30000"
  
  # Health check configuration
  health.check.interval: "30"
  health.check.timeout: "5"
  
  # Resource capacity information
  resource.cpu.limit: "500m"
  resource.memory.limit: "512Mi"
  resource.cpu.request: "100m"
  resource.memory.request: "128Mi"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: production
  labels:
    app: simple-contact-manager
type: Opaque
stringData:
  # Database password - replace with actual secret from CI/CD
  db-password: "password"  # In production, inject from secrets manager
