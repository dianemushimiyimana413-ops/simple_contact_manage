apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: production
spec:
  hard:
    # Pod limits
    pods: "10"                      # Maximum 10 pods in namespace
    
    # Compute resource limits
    requests.cpu: "2"              # Total CPU request limit: 2 cores
    limits.cpu: "4"                # Total CPU limit: 4 cores
    requests.memory: "2Gi"         # Total memory request: 2GB
    limits.memory: "4Gi"           # Total memory limit: 4GB
    
    # Storage limits
    requests.storage: "50Gi"       # Total storage request
    limits.ephemeral-storage: "20Gi"
    
    # Other resource limits
    persistentvolumeclaims: "5"
    services.loadbalancers: "2"
    services.nodeports: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: app-limits
  namespace: production
spec:
  limits:
  - max:
      cpu: "1"
      memory: "1Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "2"
      memory: "2Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    type: Pod
