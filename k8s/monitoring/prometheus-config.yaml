apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/alerts.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: simple-contact-manager
        metrics_path: /metrics
        static_configs:
          - targets: ['simple-contact-manager.default.svc.cluster.local:80']
  alerts.yml: |
    groups:
      - name: reliability.rules
        rules:
          # Error budget alert (example)
          - alert: HighErrorRate
            expr: |
              (
                increase(http_requests_total{job="simple-contact-manager",status=~"5.."}[5m])
                /
                increase(http_requests_total{job="simple-contact-manager"}[5m])
              ) > 0.001
            for: 5m
            labels:
              severity: page
            annotations:
              summary: "High 5xx error rate for simple-contact-manager ({{ $labels.job }})"
              description: "Ratio of 5xx errors over last 5m is > 0.1% (error budget). Tune threshold to your SLO."

