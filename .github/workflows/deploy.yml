name: CD - Deploy to Kubernetes

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      deployment_strategy:
        description: 'Deployment strategy'
        required: true
        default: 'rolling'
        type: choice
        options:
          - rolling
          - blue-green
          - canary

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/simple-contact-manager
  KUBE_NAMESPACE: production

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      strategy: ${{ steps.strategy.outputs.strategy }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine deployment strategy
        id: strategy
        run: |
          if [ "${{ github.event.inputs.deployment_strategy }}" != "" ]; then
            STRATEGY="${{ github.event.inputs.deployment_strategy }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            STRATEGY="blue-green"
          else
            STRATEGY="rolling"
          fi
          echo "strategy=$STRATEGY" >> $GITHUB_OUTPUT
          echo "Using deployment strategy: $STRATEGY"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

  deploy:
    runs-on: ubuntu-latest
    needs: setup
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    environment:
      name: production
      url: https://contact-manager.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Extract image tag
        id: image_tag
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=latest
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create namespace
        run: |
          kubectl create namespace ${{ env.KUBE_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply ConfigMaps and Secrets
        run: |
          kubectl apply -f k8s/database/configmap.yaml -n ${{ env.KUBE_NAMESPACE }}

      - name: Deploy with rolling strategy
        if: needs.setup.outputs.strategy == 'rolling'
        run: |
          IMAGE_TAG=${{ steps.image_tag.outputs.tag }}
          bash scripts/deploy-rolling.sh $IMAGE_TAG

      - name: Deploy with blue-green strategy
        if: needs.setup.outputs.strategy == 'blue-green'
        run: |
          IMAGE_TAG=${{ steps.image_tag.outputs.tag }}
          bash scripts/deploy-blue-green.sh $IMAGE_TAG

      - name: Deploy with canary strategy
        if: needs.setup.outputs.strategy == 'canary'
        run: |
          IMAGE_TAG=${{ steps.image_tag.outputs.tag }}
          bash scripts/deploy-canary.sh $IMAGE_TAG

      - name: Verify deployment
        run: |
          echo "Waiting for deployment to be ready..."
          kubectl rollout status deployment/contact-manager \
            -n ${{ env.KUBE_NAMESPACE }} \
            --timeout=5m
          echo "Deployment verification complete"

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          HEALTH_CHECK=$(kubectl get service contact-manager -n ${{ env.KUBE_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "localhost:3000")
          
          for i in {1..30}; do
            if curl -f -m 5 http://$HEALTH_CHECK/health 2>/dev/null; then
              echo "✅ Health check passed on attempt $i"
              exit 0
            fi
            echo "⏳ Attempt $i/30 - waiting for service..."
            sleep 10
          done
          
          echo "❌ Health check failed after 30 attempts"
          exit 1

      - name: Slack notification - success
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ Deployment Successful",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Successful* 🎉\n*Strategy:* ${{ needs.setup.outputs.strategy }}\n*Image:* `${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}`\n*Branch:* ${{ github.ref_name }}"
                  }
                }
              ]
            }

      - name: Slack notification - failure
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ Deployment Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Deployment Failed* ❌\n*Strategy:* ${{ needs.setup.outputs.strategy }}\n*Image:* `${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}`\n*Branch:* ${{ github.ref_name }}\nCheck logs for details"
                  }
                }
              ]
            }

  rollback:
    if: failure() && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Rollback deployment
        run: |
          echo "⚠️ Initiating automatic rollback..."
          kubectl rollout undo deployment/contact-manager -n ${{ env.KUBE_NAMESPACE }}
          kubectl rollout status deployment/contact-manager -n ${{ env.KUBE_NAMESPACE }} --timeout=5m
          echo "✅ Rollback completed"

      - name: Slack notification - rollback
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "⚠️ Automatic Rollback Executed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Automatic Rollback Executed* ⚠️\nDeployment failed and was rolled back to the previous stable version"
                  }
                }
              ]
            }
