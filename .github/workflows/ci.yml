name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: contacts_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run linting
      run: npm run lint
    
    - name: Run tests
      run: npm test
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASSWORD: password
        DB_NAME: contacts_db

    - name: Slack notify (success)
      if: success() && secrets.SLACK_WEBHOOK
      run: |
        curl -s -X POST -H 'Content-type: application/json' --data "{\"text\":\"CI Success: ${{ github.workflow }} on ${{ github.ref }} (run ${{ github.run_id }})\"}" ${{ secrets.SLACK_WEBHOOK }}

    - name: Slack notify (failure)
      if: failure() && secrets.SLACK_WEBHOOK
      run: |
        curl -s -X POST -H 'Content-type: application/json' --data "{\"text\":\"CI Failure: ${{ github.workflow }} on ${{ github.ref }} (run ${{ github.run_id }})\"}" ${{ secrets.SLACK_WEBHOOK }}

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/simple-contact-manager:${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/simple-contact-manager:latest
        file: ./Dockerfile
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image (run container)
      run: |
        docker run -d --name ci-test -p 3000:3000 ghcr.io/${{ github.repository_owner }}/simple-contact-manager:${{ github.sha }}
        sleep 12
        curl -f http://localhost:3000/health || (docker logs ci-test && exit 1)
        docker stop ci-test || true
        docker rm ci-test || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add deployment commands here
