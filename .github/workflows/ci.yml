name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm ci

      - run: npm test --silent

  build-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: simple-contact-manager:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-image:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Check Docker secrets
        if: ${{ !secrets.DOCKER_USERNAME || !secrets.DOCKER_PASSWORD }}
        run: |
          echo "ERROR: DOCKER_USERNAME and/or DOCKER_PASSWORD repository secrets are not set."
          echo "Set them in Settings → Secrets and variables → Actions, then re-run the workflow."
          exit 1

      - name: Login to DockerHub
        uses: docker/login-action@v3
        if: ${{ secrets.DOCKER_USERNAME && secrets.DOCKER_PASSWORD }}
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/simple-contact-manager:latest

  deploy-to-k8s:
    name: Deploy to Kubernetes (rolling update)
    runs-on: ubuntu-latest
    needs: push-image
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: '1.27.0'

      - name: Configure kubeconfig
        # Requires a secret named KUBE_CONFIG_DATA containing the base64-encoded kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl config view --minify

      - name: Apply manifests (namespace + resources)
        run: |
          kubectl apply -f k8s/ --recursive

      - name: Set image for rolling update and wait for rollout
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # Update deployment image to the newly built image in Docker Hub and trigger a rolling update.
          kubectl -n default set image deployment/simple-contact-manager simple-contact-manager=${DOCKER_USERNAME}/simple-contact-manager:latest --record
          kubectl -n default rollout status deployment/simple-contact-manager --timeout=300s

      - name: Post-deploy: show rollout history
        run: |
          kubectl -n default rollout history deployment/simple-contact-manager || true
